# The cmdline says loglevel=3, but the initramfs /init raises the console log
# level to 8 so that early boot is fully captured in the ESP logs -- and nothing
# ever lowers it again, so every kernel message keeps painting on the panel for
# the rest of the session. Most visibly: the QCA6390's PCIe AER *correctable*
# error reports (KERN_WARNING) scroll over the desktop whenever WiFi comes up.
#
# Put it back once userspace is running.
#
# 5, not 4, while the CPU wedge is open. The ramoops console backend is an
# ordinary `struct console` and obeys console_loglevel, so anything it must
# capture has to pass this filter -- and the parts of a lockup report that
# actually name the code do NOT come out at pr_emerg:
#
#   watchdog_hardlockup_check()  pr_emerg("Watchdog detected hard LOCKUP") -> 0
#   show_regs() -> __show_regs() + dump_backtrace(regs, NULL, KERN_DEFAULT)
#   nmi_cpu_backtrace()          pr_warn("NMI backtrace for cpu %d")       -> 4
#
# A message prints when level < console_loglevel, so at 4 we would keep the
# one-line header and lose every backtrace under it. At 5 the whole report
# reaches /sys/fs/pstore/console-ramoops-0, which is the only capture channel
# that survives the wedge (netconsole does not work over this USB gadget).
# The AER spam that motivated 4 is gone since ASPM is disabled on the link, and
# real level-4 traffic on this device is a dozen lines per boot.
#
# Put this back to `4 4 1 7` once the wedge is root-caused.
kernel.printk = 5 4 1 7
