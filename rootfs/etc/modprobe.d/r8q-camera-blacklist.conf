# r8q: keep udev from coldplugging the camera stack.
#
# Same reasoning as r8q-wifi-blacklist.conf: these modules live in
# /lib/modules, so udev would autoload them from the OF modalias as soon as the
# camss/camcc platform devices appear. CAMSS touches a whole MMIO block that
# Samsung's firmware never brings up, and a fault there at boot would need a
# physical VolUp+Power to recover from. r8q-camera.service loads them by hand,
# in order, after the geni I2C bus that carries the sensor is up.
blacklist camcc-sm8250
blacklist qcom-camss
blacklist hi847
blacklist i2c-qcom-cci
blacklist ak7375
