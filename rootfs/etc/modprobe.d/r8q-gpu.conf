# msm (Adreno GPU + DPU/DSI display) is loaded exactly once, by r8q-gpu.service,
# never by udev coldplug: it must not be unloaded (GMU/IOMMU teardown wedges the
# kernel), and sddm/KWin must start only after the msm display exists.
# Zap: Samsung-signed files + dynamic DMA region (r8q_zap_dyn) -- the DT carveout
# 0x8681a000 makes Samsung TZ hard-reset during PAS auth.
blacklist msm
options msm separate_gpu_kms=1 r8q_zap_dyn=1 r8q_zap_secvid=0
