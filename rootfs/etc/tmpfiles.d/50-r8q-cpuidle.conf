# r8q: CPU WEDGE -- partial mitigation, NOT a fix. Full description: INSTALLATION.md §11.
#
# The failure: every so often one core stops executing while the rest keep running. The
# kernel goes on answering ICMP (USB ping ~2.4 ms) while sshd cannot even emit its version
# banner, and it usually degrades to a full hang or a reset shortly afterwards:
#
#   rcu: INFO: rcu_preempt detected stalls on CPUs/tasks:
#   rcu:   5-...0: (1 GPs behind) idle=2344/1/0x4000000000000000 softirq=59911/59914 fqs=1014
#   Sending NMI from CPU 6 to CPUs 5:      <- no backtrace ever comes back
#
# What is known:
#   - Any core can die, the Cortex-A55s (cpu0-3) as well as the A77s (cpu4-7).
#   - The core has stopped, it is not asleep: idle cores answer the NMI backtrace request
#     ("skipped: idling at cpu_do_idle"), the dead one prints nothing. The one function trace
#     of a dying core ends in the cpuidle governor (menu_select), BEFORE it reaches WFI.
#   - The cause is unknown. Working theory, unproven: the core loses its clock in a CPU
#     frequency transition that never completes.
#
# What these lines are NOT: a fix for the mechanism. This file used to say that cpu7 never
# returns from the 'cpu-sleep-1-0' power collapse, and later that idle entry / a lost wake-up
# from WFI is what kills the core. Both were wrong: the wedge reproduces with state1 disabled
# on all eight cores and zero power-collapse entries since boot, and the dying core never got
# as far as WFI.
#
# Why they are kept anyway: the record. The phone wedged within minutes of desktop use before
# they were applied and has run for days with them. Cores are still lost with them applied, so
# read this as "rarer", and drop the file once the real cause is found.
#
# Testing note: with this file applied the state1 usage counters stay at zero, so no test says
# anything about the deep-idle path unless you re-enable it first:
#   for c in /sys/devices/system/cpu/cpu*/cpuidle/state1/disable; do echo 0 > $c; done
w /sys/devices/system/cpu/cpu0/cpuidle/state1/disable - - - - 1
w /sys/devices/system/cpu/cpu1/cpuidle/state1/disable - - - - 1
w /sys/devices/system/cpu/cpu2/cpuidle/state1/disable - - - - 1
w /sys/devices/system/cpu/cpu3/cpuidle/state1/disable - - - - 1
w /sys/devices/system/cpu/cpu4/cpuidle/state1/disable - - - - 1
w /sys/devices/system/cpu/cpu5/cpuidle/state1/disable - - - - 1
w /sys/devices/system/cpu/cpu6/cpuidle/state1/disable - - - - 1
w /sys/devices/system/cpu/cpu7/cpuidle/state1/disable - - - - 1
