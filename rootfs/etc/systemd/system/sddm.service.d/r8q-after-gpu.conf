# r8q: the msm display (DSI panel) and renderD128 (Adreno 650) only exist after
# r8q-gpu.service has loaded msm. KWin picks its devices once at startup; started
# earlier it would grab simpledrm (removed moments later when msm takes over) or
# fall back to llvmpipe.
[Unit]
Wants=r8q-gpu.service
After=r8q-gpu.service
