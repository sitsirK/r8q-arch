# r8q: hide the raw CAMSS video nodes from PipeWire.
#
# CAMSS exposes fourteen /dev/videoN RDI capture nodes, and WirePlumber's V4L2
# monitor offers every one of them as a camera called "Qualcomm Camera
# Subsystem". They are raw Bayer (SGRBG10_CSI2P) straight off the sensor, which
# no application can display -- an app that picks one just reports the camera as
# unavailable. The only usable device is the libcamera one, which runs the
# software ISP and hands out RGB.
#
# Match on the udev bus path, NOT on api.v4l2.cap.driver: the capability
# properties are filled in after the device is opened, while the monitor applies
# these rules at device-creation time, so a driver-name match silently never
# fires. Node numbering is not stable either. The libcamera monitor is a
# separate section and is left alone.
monitor.v4l2.rules = [
  {
    matches = [
      {
        device.bus-path = "platform-ac6a000.camss"
      }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
